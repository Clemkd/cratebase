<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Cratebase — administration</title>
    <script>
      // Le thème est posé avant le premier rendu : appliqué depuis React, il produirait un éclair
      // blanc sur chaque chargement d'une console configurée en sombre.
      (function () {
        try {
          var stored = localStorage.getItem('cratebase.theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)

          document.documentElement.classList.toggle('dark', dark)
        } catch (error) {
          // Stockage inaccessible (navigation privée stricte) : le thème clair reste le repli.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
